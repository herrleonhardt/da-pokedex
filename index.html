<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéDAx</title>
    <link
      rel="shortcut icon"
      href="./assets/img/logo.ico"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body onload="init()">
    <header>
      <div class="flex-row width-100 content-limit header__content">
        <div class="header__logo">
        <img class="logo" src="./assets/img/logo.png" alt="" />
        <h1>
          PokéDAx
          <span style="font-size: var(--font-lg)">- fetch 'em all!</span>
        </h1>
        </div>
        <div class="logo--ghost"></div>
      </div>
    </header>
    <main class="width-100">
      <div id="cards-container" class="width-100 content-limit cards-container">
        <!-- dynamically filled by script -->
      </div>
    </main>
    <dialog id="dialog" closedby="any">
      <div class="dialog__header">
        <div class="dialog__maininfos">
          <p id="dialog-pkm-id" class="pkm__id">#0001</p>
          <h3 class="pkm__name">Bulbasaur</h3>
          <div class="dialog__types">
            <div class="card__type" style="--type: var(--type-${type}-dark); --type-border: var(--type-${type});">
                <img src="./assets/img/type-icons/dragon.png" alt="">
                <p>type</p>
            </div>
          </div>
        </div>
        <img class="dialog__header-img" src="./assets/img/example/1.png" alt="">
        <button class="btn__dialog-close" commandfor="dialog" command="close">X</button>
      </div>
      <div class="dialog__main-content">
        <div class="dialog__description dialog__infocontainer">

        </div>
        <div class="subcontainer">
          <div class="dialog__stats dialog__infocontainer">
            <h3 class="flex-row gap-8"><img class="icon" src="./assets/img/icons/stats.png" alt="">Base Stats</h3>
            <div class="separator"></div>
            <div id="statscontainer"></div>
          </div>
          <div class="dialog__evolution-chain dialog__infocontainer">

          </div>
        </div>
      </div>
      <div class="dialog__footer"></div>
    </dialog>
    <footer>
      <div class="content-limit width-100 footer__content">
        <p>copyright Stefan Leonhardt 2026</p>
      </div>
    </footer>
  </body>
  <script src="./js/utils.js"></script>
  <script src="./js/html-templates.js"></script>
  <script src="./main.js"></script>
</html>
